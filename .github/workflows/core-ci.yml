name: Core CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  workflow_call:
    inputs:
      build-artifacts:
        description: Build cross binaries and SDK smoke (release builds these separately)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate workflow tools and pinned platform matrix
        run: |
          python3 scripts/verify-release.py --check-matrix
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m unittest discover -s openwrt/tests/runtime-smoke -p 'test_*.py' -v
          python3 openwrt/tests/runtime-smoke/run.py --help
      - name: Lint GitHub workflows
        run: |
          GOBIN="$RUNNER_TEMP/workflow-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$RUNNER_TEMP/workflow-tools/actionlint" -color -shellcheck=''

  build-context:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.context.outputs.version }}
      commit: ${{ steps.context.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build inputs
        id: context
        run: |
          sh -n scripts/build-release.sh
          jq -e '.schema_version == 1 and (.entries | length > 0)' .github/openwrt-sdk-matrix.json >/dev/null
          version="$(tr -d '\r\n' < VERSION)-ci.${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Build
        run: make build

  unit-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Unit tests with coverage
        run: |
          set -o pipefail
          go test -json -covermode=atomic -coverprofile=coverage.out ./... | tee test-results.json
      - name: BUILD-TRACE-001 record test metadata
        if: always()
        run: |
          python3 - "$GITHUB_SHA" "$(go version)" "$(go env GOOS)" "$(go env GOARCH)" <<'PY' > test-metadata.json
          import json
          import pathlib
          import re
          import sys

          source = pathlib.Path("internal/config/config.go").read_text(encoding="utf-8")
          match = re.search(r"(?m)^const SchemaVersion = ([0-9]+)$", source)
          if match is None:
              raise SystemExit("config schema version constant not found")
          json.dump({
              "commit": sys.argv[1],
              "go_version": sys.argv[2],
              "goos": sys.argv[3],
              "goarch": sys.argv[4],
              "config_schema_version": int(match.group(1)),
          }, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PY
      - name: Coverage summary
        if: always()
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          echo "## Core coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-evidence
          if-no-files-found: warn
          path: |
            core/test-results.json
            core/coverage.out
            core/coverage.txt
            core/test-metadata.json

  race-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Full race suite
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee race.log
      - name: Deterministic stress suite
        run: |
          set -o pipefail
          make stress 2>&1 | tee stress.log
      - name: Upload race and stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-stress-evidence
          path: core/*.log
          retention-days: 7

  openwrt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: OpenWrt config and procd contracts
        run: make shell-check
        env:
          TEST_ARTIFACT_DIR: ${{ github.workspace }}/core/test-artifacts/openwrt
      - name: Upload OpenWrt failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-contract-failure
          if-no-files-found: warn
          path: core/test-artifacts/openwrt/**

  go-cross-build:
    if: toJSON(inputs.build-artifacts) != 'false'
    needs: build-context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - "386"
          - arm64
          - armv5
          - armv6
          - armv7
          - mips-softfloat
          - mipsle-softfloat
          - riscv64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Cross-build static binary
        env:
          BUILD_VERSION: ${{ needs.build-context.outputs.version }}
          BUILD_COMMIT: ${{ needs.build-context.outputs.commit }}
        run: |
          ./scripts/build-release.sh \
            --platform linux \
            --arch '${{ matrix.arch }}' \
            --version "$BUILD_VERSION" \
            --commit "$BUILD_COMMIT" \
            --output-dir 'dist/${{ matrix.arch }}'
      - name: Upload cross-build evidence
        uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: dist/${{ matrix.arch }}/*

  openwrt-sdk-smoke:
    if: toJSON(inputs.build-artifacts) != 'false'
    needs: build-context
    uses: ./.github/workflows/openwrt-sdk.yml
    with:
      selection: smoke
      version: ${{ needs.build-context.outputs.version }}
      commit: ${{ needs.build-context.outputs.commit }}
      retention-days: 7

  test-core:
    if: always()
    needs:
      - build-context
      - workflow-validation
      - quality
      - unit-coverage
      - race-stress
      - openwrt-contract
      - go-cross-build
      - openwrt-sdk-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          test '${{ needs.build-context.result }}' = success
          test '${{ needs.workflow-validation.result }}' = success
          test '${{ needs.quality.result }}' = success
          test '${{ needs.unit-coverage.result }}' = success
          test '${{ needs.race-stress.result }}' = success
          test '${{ needs.openwrt-contract.result }}' = success
          if [ "$BUILD_ARTIFACTS" = false ]; then
            test '${{ needs.go-cross-build.result }}' = skipped
            test '${{ needs.openwrt-sdk-smoke.result }}' = skipped
          else
            test '${{ needs.go-cross-build.result }}' = success
            test '${{ needs.openwrt-sdk-smoke.result }}' = success
          fi
        env:
          BUILD_ARTIFACTS: ${{ toJSON(inputs.build-artifacts) != 'false' }}
