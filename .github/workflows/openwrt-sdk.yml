name: OpenWrt SDK build

on:
  workflow_call:
    inputs:
      selection:
        description: "Matrix selection: smoke or all"
        required: false
        default: smoke
        type: string
      version:
        description: Version injected into UAmask and package metadata
        required: true
        type: string
      commit:
        description: Source commit recorded in build metadata
        required: true
        type: string
      retention-days:
        description: Artifact retention period
        required: false
        default: 14
        type: number
  workflow_dispatch:
    inputs:
      selection:
        description: Matrix selection
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - all
      version:
        description: Build version; defaults to VERSION-canary.SHORT_SHA
        required: false
        type: string
      commit:
        description: Commit recorded in metadata; defaults to workflow SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.context.outputs.version }}
      commit: ${{ steps.context.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build context
        id: context
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          version="$INPUT_VERSION"
          commit="$INPUT_COMMIT"
          if [ -z "$version" ]; then
            version="$(tr -d '\r\n' < VERSION)-canary.${GITHUB_SHA::7}"
          fi
          if [ -z "$commit" ]; then
            commit="$GITHUB_SHA"
          fi
          test "$commit" = "$(git rev-parse HEAD)"
          [[ "$version" =~ ^[0-9A-Za-z._+-]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Select pinned SDK matrix
        id: matrix
        env:
          SELECTION: ${{ inputs.selection }}
        run: |
          selection="${SELECTION:-smoke}"
          case "$selection" in
            smoke)
              matrix=$(jq -c '{include: [.entries[] | select(.smoke == true)]}' .github/openwrt-sdk-matrix.json)
              ;;
            all)
              matrix=$(jq -c '{include: .entries}' .github/openwrt-sdk-matrix.json)
              ;;
            *)
              echo "unsupported matrix selection: $selection" >&2
              exit 1
              ;;
          esac
          test "$(jq '.include | length' <<< "$matrix")" -gt 0
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.id }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: mkdir -p .cache/evidence

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Cache pinned SDK archive
        uses: actions/cache@v4
        with:
          path: .cache/openwrt-sdk
          key: openwrt-sdk-${{ matrix.id }}-${{ matrix.sdk_sha256 }}

      - name: Download and verify official SDK
        id: sdk
        env:
          SDK_ID: ${{ matrix.id }}
          SDK_URL: ${{ matrix.sdk_url }}
          SDK_SHA256: ${{ matrix.sdk_sha256 }}
        run: |
          case "$SDK_URL" in
            https://downloads.openwrt.org/releases/*) ;;
            *)
              echo "SDK URL is not an official pinned release: $SDK_URL" >&2
              exit 1
              ;;
          esac
          mkdir -p .cache/openwrt-sdk "$RUNNER_TEMP/openwrt-sdk"
          archive=".cache/openwrt-sdk/$(basename "$SDK_URL")"
          if [ ! -f "$archive" ]; then
            curl -fL --retry 5 --retry-all-errors -o "$archive" "$SDK_URL"
          fi
          printf '%s  %s\n' "$SDK_SHA256" "$archive" | sha256sum -c -

          extract_dir="$RUNNER_TEMP/openwrt-sdk/$SDK_ID"
          mkdir -p "$extract_dir"
          case "$archive" in
            *.tar.xz) tar -xJf "$archive" --strip-components=1 -C "$extract_dir" ;;
            *.tar.zst) tar --zstd -xf "$archive" --strip-components=1 -C "$extract_dir" ;;
            *)
              echo "unsupported SDK archive: $archive" >&2
              exit 1
              ;;
          esac
          test -f "$extract_dir/include/toplevel.mk"
          echo "dir=$extract_dir" >> "$GITHUB_OUTPUT"

      - name: Build target package
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
          SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: |
          set -o pipefail
          ./scripts/build-release.sh \
            --platform openwrt \
            --arch '${{ matrix.build_arch }}' \
            --version "$BUILD_VERSION" \
            --commit "$BUILD_COMMIT" \
            --output-dir 'dist/${{ matrix.id }}' \
            --sdk-dir "$SDK_DIR" \
            --openwrt-version '${{ matrix.openwrt }}' \
            --target '${{ matrix.target }}' \
            --subtarget '${{ matrix.subtarget }}' \
            --package-arch '${{ matrix.package_arch }}' \
            --package-format '${{ matrix.package_format }}' \
            2>&1 | tee .cache/evidence/build.log

      - name: Verify trace metadata and checksum
        env:
          EXPECTED_ID: ${{ matrix.id }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          EXPECTED_OPENWRT: ${{ matrix.openwrt }}
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_SUBTARGET: ${{ matrix.subtarget }}
          EXPECTED_ARCH: ${{ matrix.package_arch }}
          EXPECTED_FORMAT: ${{ matrix.package_format }}
          SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: |
          output="dist/$EXPECTED_ID"
          package=$(find "$output" -maxdepth 1 -type f \( -name 'UAmask_*.ipk' -o -name 'UAmask-*.apk' \) -print)
          test -n "$package"
          test "$(printf '%s\n' "$package" | wc -l)" -eq 1
          (cd "$output" && sha256sum -c "$(basename "$package").sha256")
          python3 - "$package.metadata.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)

          expected = {
              "version": os.environ["EXPECTED_VERSION"],
              "commit": os.environ["EXPECTED_COMMIT"],
              "dirty": False,
              "openwrt_version": os.environ["EXPECTED_OPENWRT"],
              "target": os.environ["EXPECTED_TARGET"],
              "subtarget": os.environ["EXPECTED_SUBTARGET"],
              "package_architecture": os.environ["EXPECTED_ARCH"],
              "package_format": os.environ["EXPECTED_FORMAT"],
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"{key}: got {metadata.get(key)!r}, want {value!r}")
          if not metadata.get("package_version"):
              raise SystemExit("package_version is missing")
          PY
          case "$EXPECTED_FORMAT" in
            ipk)
              tar -xOf "$package" ./data.tar.gz | tar -tzf - | grep -Fx './usr/bin/UAmask'
              ;;
            apk)
              "$SDK_DIR/staging_dir/host/bin/apk" verify --allow-untrusted "$package"
              "$SDK_DIR/staging_dir/host/bin/apk" adbdump "$package" | grep -F "arch: $EXPECTED_ARCH"
              ;;
          esac

      - name: Install virtual machine prerequisites
        if: matrix.smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils openssh-client

      - name: Cache pinned guest image
        if: matrix.smoke
        uses: actions/cache@v4
        with:
          path: .cache/openwrt-images
          key: openwrt-image-${{ matrix.openwrt }}-${{ hashFiles('openwrt/tests/runtime-smoke/platforms.json') }}

      - name: Install exact package and verify service in disposable OpenWrt
        if: matrix.smoke
        env:
          OPENWRT_VERSION: ${{ matrix.openwrt }}
          SDK_ID: ${{ matrix.id }}
          PACKAGE_FORMAT: ${{ matrix.package_format }}
        run: |
          packages=(dist/"$SDK_ID"/*."$PACKAGE_FORMAT")
          test "${#packages[@]}" -eq 1
          python3 openwrt/tests/runtime-smoke/run.py \
            --openwrt "$OPENWRT_VERSION" \
            --package "${packages[0]}" \
            --metadata "${packages[0]}.metadata.json" \
            --cache-dir .cache/openwrt-images \
            --run-dir .cache/evidence/runtime

      - name: Record runtime result in job summary
        if: always() && matrix.smoke
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          result = pathlib.Path('.cache/evidence/runtime/result.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Exact-package OpenWrt smoke\n\n')
              if result.exists():
                  summary.write('```json\n' + json.dumps(json.loads(result.read_text()), indent=2) + '\n```\n')
              else:
                  summary.write('Runtime did not produce a result. Inspect earlier build/prerequisite steps.\n')
          PY

      - name: Upload build and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.id }}
          if-no-files-found: warn
          retention-days: ${{ inputs['retention-days'] || 14 }}
          include-hidden-files: true
          path: |
            .cache/evidence/**/*.log
            .cache/evidence/**/*.txt
            .cache/evidence/**/*.json
            .cache/evidence/**/*.jsonl

      - name: Upload target package
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.id }}
          if-no-files-found: error
          retention-days: ${{ inputs['retention-days'] || 14 }}
          path: dist/${{ matrix.id }}/*
